name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: # 允許手動觸發

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      - name: Use verified npm version
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package and demo contracts
        run: npm run verify

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: |
            dist/lib/
            dist/demo/
          retention-days: 7
