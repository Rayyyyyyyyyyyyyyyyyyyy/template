name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # 當推送 v 開頭的 tag 時觸發
  workflow_dispatch: # 允許手動觸發

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create GitHub Release 需要
      id-token: write # npm Trusted Publishing (OIDC) 需要

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Use verified npm version
        run: npm install --global npm@11.6.0

      - name: Install dependencies
        run: npm ci

      - name: Verify package and demo contracts
        run: npm run verify

      - name: Publish to NPM
        run: npm publish --ignore-scripts

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            - Automated release via GitHub Actions
            - Version: ${{ github.ref_name }}

            ## Installation

            ```bash
            npm install rayyy-vue-table-components@latest
            ```
          draft: false
          prerelease: false
